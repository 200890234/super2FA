name: Build and Release

# Build super2fa.exe on every published GitHub Release, and also when a
# "v*" tag is pushed (so a tag alone creates the release automatically).
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtain AutoHotkey v2 (Ahk2Exe)
        id: ahk
        shell: pwsh
        run: |
          function Find-Ahk2Exe {
            $cands = @(
              "C:\Program Files\AutoHotkey\v2\Ahk2Exe.exe",
              "C:\Program Files\AutoHotkey\Ahk2Exe.exe",
              "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe",
              "C:\Program Files (x86)\AutoHotkey\v2\Ahk2Exe.exe",
              "C:\Program Files (x86)\AutoHotkey\Ahk2Exe.exe"
            )
            foreach ($c in $cands) { if (Test-Path $c) { return Get-Item $c } }
            $roots = @(
              "C:\Program Files\AutoHotkey",
              "C:\Program Files (x86)\AutoHotkey",
              "C:\ProgramData\chocolatey",
              "$env:RUNNER_TEMP\ahk"
            )
            foreach ($r in $roots) {
              if (Test-Path $r) {
                $f = Get-ChildItem $r -Recurse -Filter Ahk2Exe.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($f) { return $f }
              }
            }
            return $null
          }

          function Get-FromZip {
            $url = "https://www.autohotkey.com/download/2.0/AutoHotkey_2.0.19.zip"
            $zip = "$env:RUNNER_TEMP\ahk.zip"
            $dest = "$env:RUNNER_TEMP\ahk"
            Write-Host "Downloading portable ZIP: $url"
            Invoke-WebRequest -Uri $url -OutFile $zip -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -MaximumRetryCount 3 -RetryIntervalSec 5 -TimeoutSec 120
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            $f = Get-ChildItem $dest -Recurse -Filter Ahk2Exe.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { return $f.FullName }
            return $null
          }

          $exe = Find-Ahk2Exe
          if (-not $exe) {
            $p = Get-FromZip
            if ($p) { $exe = Get-Item $p }
          }
          if (-not $exe) {
            Write-Host "ZIP method failed; trying Chocolatey..."
            choco install autohotkey.install --version=2.0.19 -y --no-progress
            $exe = Find-Ahk2Exe
          }
          if (-not $exe) { throw "Ahk2Exe.exe not found after all attempts" }
          Write-Host "Using Ahk2Exe: $($exe.FullName)"
          "path=$($exe.FullName)" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Compile super2fa.exe
        shell: pwsh
        run: |
          & "${{ steps.ahk.outputs.path }}" /in super2fa.ahk /out super2fa.exe
          if (-not (Test-Path super2fa.exe)) { throw "Compilation failed: super2fa.exe was not produced" }

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: super2fa.exe

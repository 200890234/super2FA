name: Build and Release

# Build super2fa.exe on every published GitHub Release, and also when a
# "v*" tag is pushed (so a tag alone creates the release automatically).
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2 runtime + Ahk2Exe compiler
        id: ahk
        shell: pwsh
        run: |
          # 1) AHK v2 runtime (choco works on the runners; it does NOT ship Ahk2Exe).
          choco install autohotkey.install --version=2.0.19 -y --no-progress

          # 2) Ahk2Exe compiler from its own GitHub releases (supports v2 scripts).
          #    "latest/download" always resolves to the newest release's asset.
          $url = "https://github.com/AutoHotkey/Ahk2Exe/releases/latest/download/Ahk2Exe.zip"
          $zip = "$env:RUNNER_TEMP\ahk2exe.zip"
          Write-Host "Downloading Ahk2Exe from $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5 -TimeoutSec 120
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ahk2exe" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ahk2exe" -Recurse -Filter Ahk2Exe.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Ahk2Exe.exe not found in the downloaded package" }
          Write-Host "Using Ahk2Exe: $($exe.FullName)"
          "path=$($exe.FullName)" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Compile super2fa.exe
        shell: pwsh
        run: |
          & "${{ steps.ahk.outputs.path }}" /in super2fa.ahk /out super2fa.exe
          if (-not (Test-Path super2fa.exe)) { throw "Compilation failed: super2fa.exe was not produced" }

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: super2fa.exe

name: Build and Release

# Build super2fa.exe on every published GitHub Release, and also when a
# "v*" tag is pushed (so a tag alone creates the release automatically).
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtain AutoHotkey v2 (Ahk2Exe)
        id: ahk
        shell: pwsh
        run: |
          function Find-Ahk2Exe {
            param($Roots)
            foreach ($r in $Roots) {
              if (Test-Path $r) {
                $f = Get-ChildItem $r -Recurse -FollowSymlink -Filter Ahk2Exe.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($f) { return $f.FullName }
              }
            }
            return $null
          }

          function Get-FromGitHubZip {
            $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip"
            $zip = "$env:RUNNER_TEMP\ahk.zip"
            $dest = "$env:RUNNER_TEMP\ahk"
            Write-Host "Downloading AutoHotkey from GitHub: $url"
            Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5 -TimeoutSec 120
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            return Find-Ahk2Exe @($dest)
          }

          $p = Get-FromGitHubZip
          if (-not $p) {
            Write-Host "GitHub ZIP method failed; trying Chocolatey..."
            choco install autohotkey.install --version=2.0.19 -y --no-progress
            $p = Find-Ahk2Exe @("C:\Program Files\AutoHotkey", "C:\Program Files (x86)\AutoHotkey")
            if (-not $p) {
              Write-Host "---- AutoHotkey install tree (debug) ----"
              Get-ChildItem "C:\Program Files\AutoHotkey" -Recurse -FollowSymlink -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -HideTableHeaders | Out-String | Write-Host
            }
          }
          if (-not $p) { throw "Ahk2Exe.exe not found after all attempts" }
          Write-Host "Using Ahk2Exe: $p"
          "path=$p" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Compile super2fa.exe
        shell: pwsh
        run: |
          & "${{ steps.ahk.outputs.path }}" /in super2fa.ahk /out super2fa.exe
          if (-not (Test-Path super2fa.exe)) { throw "Compilation failed: super2fa.exe was not produced" }

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: super2fa.exe

name: Build and Release

# Build super2fa.exe on every published GitHub Release, and also when a
# "v*" tag is pushed (so a tag alone creates the release automatically).
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2 (Chocolatey)
        shell: pwsh
        run: |
          choco install autohotkey.install --version=2.0.19 -y

      - name: Locate Ahk2Exe (fall back to official installer)
        id: ahk
        shell: pwsh
        run: |
          $exe = Get-ChildItem "C:\Program Files\AutoHotkey" -Recurse -Filter Ahk2Exe.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Ahk2Exe not found after choco install; downloading official installer..."
            $url = "https://www.autohotkey.com/download/2.0/AutoHotkey_2.0.19_setup.exe"
            $setup = "$env:RUNNER_TEMP\ahk_setup.exe"
            Invoke-WebRequest -Uri $url -OutFile $setup -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -MaximumRetryCount 3 -RetryIntervalSec 5
            Start-Process -FilePath $setup -ArgumentList "/S" -Wait
            $exe = Get-ChildItem "C:\Program Files\AutoHotkey" -Recurse -Filter Ahk2Exe.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) { throw "Ahk2Exe.exe not found after install attempts" }
          Write-Host "Using Ahk2Exe: $($exe.FullName)"
          "path=$($exe.FullName)" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Compile super2fa.exe
        shell: pwsh
        run: |
          & "${{ steps.ahk.outputs.path }}" /in super2fa.ahk /out super2fa.exe
          if (-not (Test-Path super2fa.exe)) { throw "Compilation failed: super2fa.exe was not produced" }

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: super2fa.exe
